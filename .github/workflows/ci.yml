name: ClaimAssist AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    name: Test Node Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: cd server && npm ci || npm install
      - name: Run server tests
        run: cd server && npx vitest run --passWithNoTests
        env:
          JWT_SECRET: ci-test-jwt-secret-key-1234567890
          MONGO_URI: mongodb://127.0.0.1:27017/claimassist_test

  test-client:
    name: Test React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: cd client && npm ci || npm install
      - name: Build frontend
        run: cd client && npm run build

  test-ai-service:
    name: Test Python AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: cd ai-service && pip install -r requirements.txt
      - name: Run pytest
        run: cd ai-service && python -m pytest tests/
