    <meta name="keywords" content="claimassist, medical billing, health insurance appeals, denial management, healthcare AI, RAG policy retrieval" />

      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("claimassist_theme");
          if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <title>ClaimAssist AI — Intelligent Denial Analysis & Appeals</title>
